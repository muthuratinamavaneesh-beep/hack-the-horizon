services:
  - type: web
    name: hackathon-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: hackathon-db
    databaseName: hackathon
    user: admin
